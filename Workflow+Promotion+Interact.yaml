b;\">\n                    <a href=\"https://app.torq.io/interactions/b841f970-1908-45c8-af83-b907ceedb4c3?account=craigr-dev\"\n                       target=\"_blank\"\n                       style=\"display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;letter-spacing:0.3px;\">\n                      ✅ &nbsp;Review &amp; Approve Request\n                    </a>\n                  </td>\n                </tr>\n              </table>\n\n              <!-- Divider -->\n              <hr style=\"border:none;border-top:1px solid #e5e7eb;margin:0 0 28px;\" />\n\n              <!-- Note Box -->\n              <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\">\n                <tr>\n                  <td style=\"background-color:#eff6ff;border-left:4px solid #1a56db;border-radius:4px;padding:14px 18px;\">\n                    <p style=\"margin:0;font-size:13.5px;color:#1e40af;line-height:1.6;\">\n                      <strong>Note:</strong> If you were not expecting this request or believe this was sent in error, please disregard this email or contact your administrator.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Footer -->\n          <tr>\n            <td style=\"background-color:#f9fafb;padding:24px 40px;border-top:1px solid #e5e7eb;text-align:center;\">\n              <p style=\"margin:0 0 6px;font-size:12px;color:#9ca3af;\">This is an automated notification. Please do not reply directly to this email.</p>\n              <p style=\"margin:0;font-size:12px;color:#9ca3af;\">\n                Having trouble with the button? \n                <a href=\"https://app.torq.io/interactions/b841f970-1908-45c8-af83-b907ceedb4c3?account=craigr-dev\"\n                   style=\"color:#1a56db;text-decoration:underline;\">Copy this link</a>\n              </p>\n            </td>\n          </tr>\n\n 