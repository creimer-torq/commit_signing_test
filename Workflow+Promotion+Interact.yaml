        FLOW_SETTINGS: '{"name":"Interaction Flow","openToOrgSso":false,"allowedToCancelExecution":false,"cancelExecutionWhenTimedOut":false,"logoUrl":"https://app.torq.io/images/logo/logo.svg","permissions":{"emails":[],"domains":[],"roles":[],"workspaceGroups":[],"allowWorkspaceUsers":true,"allowOrgSsoUsers":false,"allowAllOrgSsoUsers":false}}'
        FORM_SCHEMA: "{ \"parameters\": [{\"name\":\"information\",\"type\":\"MARKDOWN_TEXT\",\"prettyName\":\"Information\",\"value\":\"### Select Your Options\\n\\nUse the dropdowns below to configure your resource promotion request.\\n\\n---\\n\\n### 1. Target Workspaces\\nSelect which workspace(s) will receive the submitted resources.\\n\\n- Choose one or multiple production workspaces\\n- Selected resources will be promoted to **all selected workspaces** upon approval\\n\\n---\\n\\n### 2. (Optional) Workflows to Submit\\nSelect which workflow(s) to promote.\\n\\n- Only **published workflows** from your development workspace are available\\n- You may submit **multiple workflows** in a single request\\n\\n---\\n\\n### 3. (Optional) Tags to Submit\\nSelect which workflow tag(s) to promote.\\n\\n- **All workflows** associated with the selected tag(s) will be submitted for approval\\n- Only **published workflows** from your development workspace are available\\n- You may submit **multiple tags** in a single request\\n\\n---\\n\\n### 4. (Optional) Variables to Submit\\nSelect which workspace variable(s) to promote.\\n\\n- Selected workspace variables will be submitted for approval\\n- You may submit **multiple variables** in a single request\\n- Any existing variables with the **same name in the target workspace will be overwritten**\\n\\n---\\n\\n### \U0001F4A1 Tips\\n\\n- ✅ Submit resources that are **fully tested and ready** for the target environment  \\n- ✅ Review dependencies and ensure **required integrations or configurations exist** in the target workspace(s)  \\n- ✅ Group **related resources together** to simplify approval and tracking  \\n\\n---\\n\\nOnce you've made your selections, click **Submit for Approval** to send your request to reviewers.\",\"selectDisplayMode\":\"DROPDOWN_DISPLAY\"}, {\"name\":\"workflows_to_submit\",\"type\":\"MULTI_SELECT\",\"prettyName\":\"Workflows to Submit\",\"optionsList\":{{ $.formatted_workflow_list.output }},\"values\":{},\"allowMultipleFiles\":true,\"selectDisplayMode\":\"DROPDOWN_DISPLAY\"}, {\"name\":\"tags_to_submit\",\"type\":\"MULTI_SELECT\",\"prettyName\":\"Tags to Submit\",\"description\":\"Submit all workflows with the following tag(s) for approval.\",\"optionsList\":{{ $.formatted_tag_list.output }},\"selectDisplayMode\":\"DROPDOWN_DISPLAY\"}, {\"name\":\"variables_to_submit\",\"type\":\"MULTI_SELECT\",\"prettyName\":\"Variables to Submit\",\"description\":\"Workspace variable(s) to submit for approval.\",\"optionsList\":{{ $.formatted_variable_list.output }},\"values\":{},\"allowMultipleFiles\":true,\"selectDisplayMode\":\"DROPDOWN_DISPLAY\"}, {\"name\":\"workspaces\",\"type\":\"MULTI_SELECT\",\"required\":true,\"prettyName\":\"Target Workspaces\",\"optionsList\":{{ $.formatted_workspace_list.output }},\"values\":{},\"allowMultipleFiles\":true,\"selectDisplayMode\":\"DROPDOWN_DISPLAY\"}, {\"name\":\"user_action_button\",\"type\":\"BUTTONS\",\"buttons\":[{\"text\":\"Submit for Approval\"},{\"text\":\"Exit\"}]}]}"
        FORM_TITLE: Promote to Prod
