          - name: us-docker.pkg.dev/stackpulse/public/utils/array_utils/concat-arrays:1.3.0
            id: concat_arrays
            env:
              INPUT: '{{ if $.format_workflow_request.result }}{{ $.format_workflow_request.result }}{{else}}[]{{end}}'
              SECOND_ARRAY: '{{ if $.list_workflows_by_tag.api_object.workflows }}{{ $.list_workflows_by_tag.api_object.workflows }}{{else}}[]{{end}}'
            uuid: 8dc51e51-b9c0-451a-b3cd-0ea63608de10
            pretty_name: Concat Arrays
            options:
              executor:
                name: utils_infrastructure_v_1_41_0
                env: {}
                sync: true
                disable: false
            documentationUrl: https://learn.torq.io/docs/array-utilities#concat-arrays
            manifestId: 0692cd25-0cfd-56a9-8ac1-554606132dbf
            isPrivate: false
            mock_output:
              enabled: false
            skip: false
            retry: {}
          - loop:
              in: '{{ $.concat_arrays.result }}'
              key: loop_2_key
              value: loop_2_value
              steps:
                - name: us-docker.pkg.dev/stackpulse/public/scripting/python:3.8.0
                  id: build_dependency_tree
                  env:
                    PYTHON_CODE: |-
                      import json
                      import re
                      import requests
                      import sys

                      # ── Configuration ────────────────────────────────────────────────────
                      API_TOKEN = r'''{{ $.integrations.torq.access_token }}'''
                      API_BASE = "https://api.torq.io/public/v1alpha"
                      ROOT_WF_ID = r'''{{ $.loop_2_value.id }}'''
                      ROOT_REV_ID = r'''{{ $.loop_2_value.current_revision_id }}'''
                      ROOT_META_RAW = r'''{{ $.loop_2_value | toJson }}'''

                      HEADERS = {
                          "Authorization": f"Bearer {API_TOKEN}",
                          "Content-Type": "application/json",
                      }
                      MAX_DEPTH = 20  # safety limit to prevent runaway recursion

                      # ── API helper functions ─────────────────────────────────────────────

                      def get_workflow(workflow_id):
                          """Retrieve workflow metadata (name, current_revision_id, etc.)."""
                          url = f"{API_BASE}/workflows/{workflow_id}"
                          try:
                              resp = requests.get(url, headers=HEADERS, timeout=30)
                              resp.raise_for_status()
                              return resp.json()
                          except Exception as e:
                              print(f"WARN: Failed to get workflow {workflow_id}: {e}", file=sys.stderr)
                              return None


                      def get_revision_yaml(workflow_id, revision_id):
                          """Retrieve the YAML content of a specific workflow revision."""
                          url = f"{API_BASE}/workflows/{workflow_id}/revision/{revision_id}"
                          try:
                              resp = requests.get(url, headers=HEADERS, timeout=30)
                              resp.raise_for_status()
                              data = resp.json()
                              return data.get("yaml", "")
                          except Exception as e:
                              print(f"WARN: Failed to get revision {revision_id} for {workflow_id}: {e}",
                                    file=sys.stderr)
                              return ""


                      def extract_nested_ids(yaml_text):
                          """Extract unique playbook_id UUIDs from workflow YAML."""
                          return list(set(re.findall(r'playbook_id:\s*([a-f0-9-]{36})', yaml_text)))


                      # ── Recursive tree builder ───────────────────────────────────────────

                      def build_tree(workflow_id, revision_id, depth=0, visited=None):
                          """Recursively build the dependency tree for a workflow."""
                          if visited is None:
                              visited = set()

                          # Circular dependency check
                          if workflow_id in visited:
                              return {
                                  "workflow_name": "CIRCULAR REFERENCE",
                                  "workflow_id": workflow_id,
                                  "revision_id": revision_id or "N/A",
                                  "level": depth,
                                  "circular_reference": True,
                                  "nested_workflows": [],
                              }

                          # Depth safety check
                          if depth > MAX_DEPTH:
                              return {
                                  "workflow_name": "MAX DEPTH EXCEEDED",
                                  "workflow_id": workflow_id,
                                  "revision_id": revision_id or "N/A",
                                  "level": depth,
                                  "max_depth_exceeded": True,
                                  "nested_workflows": [],
                              }

                          visited.add(workflow_id)

                          # Get workflow metadata
                          wf_data = get_workflow(workflow_id)
                          if wf_data is None:
                              return {
                                  "workflow_name": "UNKNOWN (API call failed)",
                                  "workflow_id": workflow_id,
                                  "revision_id": revision_id or "N/A",
                                  "level": depth,
                                  "nested_workflows": [],
                              }

                          wf_name = wf_data.get("name", "Unknown")
                          current_rev = wf_data.get("current_revision_id", revision_id or "N/A")

                          # Use provided revision_id if available, otherwise use current
                          rev_to_fetch = revision_id if revision_id else current_rev

                          # Get the YAML for this revision
                          yaml_text = get_revision_yaml(workflow_id, rev_to_fetch)

                          # Extract nested workflow IDs from the YAML
                          child_ids = extract_nested_ids(yaml_text)

                          # Build the node
                          node = {
                              "workflow_name": wf_name,
                              "workflow_id": workflow_id,
                              "revision_id": rev_to_fetch,
                              "level": depth,
                              "nested_workflows": [],
                          }

                          # Recurse into each child workflow
                          for child_id in sorted(child_ids):
                              child_node = build_tree(
                                  workflow_id=child_id,
                                  revision_id=None,  # will use current_revision_id
                                  depth=depth + 1,
                                  visited=visited.copy(),
                              )
                              node["nested_workflows"].append(child_node)

                          return node


                      # ── Main execution ───────────────────────────────────────────────────

                      root_meta = json.loads(ROOT_META_RAW)
                      tree = build_tree(ROOT_WF_ID, ROOT_REV_ID)

                      # Collect all unique workflow IDs found in the tree
                      def collect_ids(node):
                          ids = [node["workflow_id"]]
                          for child in node.get("nested_workflows", []):
                              ids.extend(collect_ids(child))
                          return ids

                      all_ids = list(set(collect_ids(tree)))

                      output = {
                          "dependency_tree": tree,
                          "summary": {
                              "total_workflows_found": len(all_ids),
                              "root_workflow": root_meta.get("name", "Unknown"),
                              "all_workflow_ids": sorted(all_ids),
                          },
                      }

                      result = json.dumps(output, indent=2)
                      print(result)
                  uuid: 1e55673a-949b-4d1c-ad2a-382a1f195c69
                  pretty_name: Build Dependency Tree
                  options:
                    executor:
                      name: ""
                      env: {}
                      sync: true
